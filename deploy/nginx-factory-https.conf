# Factory Desk — HTTPS site. Replace factory.example.com and the certificate paths, then install:
#   sudo cp deploy/nginx-factory-https.conf /etc/nginx/sites-available/factory-desk
#   sudo nginx -t && sudo systemctl reload nginx
# (zones and common snippet are installed as described in nginx-factory.conf)

# Redirect every plain-HTTP request to HTTPS (keeps the ACME challenge path for certificate renewal).
# Node.js on this machine (PM2 deployment)
upstream factory_app {
  server 127.0.0.1:8787;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name factory.example.com;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name factory.example.com;

  ssl_certificate     /etc/letsencrypt/live/factory.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/factory.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:FactorySSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Enable once HTTPS has worked reliably for a while: browsers will then refuse plain HTTP for a year.
  # add_header Strict-Transport-Security "max-age=31536000" always;

  access_log /var/log/nginx/factory-desk.access.log;
  error_log  /var/log/nginx/factory-desk.error.log warn;

  include /etc/nginx/snippets/factory-desk-common.conf;
}
