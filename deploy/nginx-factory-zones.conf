# Factory Desk — request-rate zones. Install once:
#   sudo cp deploy/nginx-factory-zones.conf /etc/nginx/conf.d/factory-desk-zones.conf
# (files in conf.d are loaded inside the http{} block)

# Login: 10 attempts/minute per client IP (the app also locks an account after repeated failures)
limit_req_zone $binary_remote_addr zone=factory_login:10m rate=10r/m;
# Other API calls: 20/second per client IP, with bursts allowed in the site config
limit_req_zone $binary_remote_addr zone=factory_api:10m rate=20r/s;
# Concurrent connections per client IP
limit_conn_zone $binary_remote_addr zone=factory_conn:10m;
