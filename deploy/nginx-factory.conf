# Factory Desk — HTTP site (access by IP before a certificate is available).
# Install:
#   sudo cp deploy/nginx-factory-zones.conf  /etc/nginx/conf.d/factory-desk-zones.conf
#   sudo cp deploy/nginx-factory-common.conf /etc/nginx/snippets/factory-desk-common.conf
#   sudo cp deploy/nginx-factory.conf        /etc/nginx/sites-available/factory-desk
#   sudo ln -sf /etc/nginx/sites-available/factory-desk /etc/nginx/sites-enabled/factory-desk
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Plain HTTP sends passwords and login tokens unencrypted — switch to nginx-factory-https.conf
# as soon as you have a certificate (see DEPLOY_SERVER.md).

# Node.js on this machine (PM2 deployment)
upstream factory_app {
  server 127.0.0.1:8787;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 43.136.121.205;

  access_log /var/log/nginx/factory-desk.access.log;
  error_log  /var/log/nginx/factory-desk.error.log warn;

  # Lets certbot (webroot mode) prove control of the domain when requesting the first certificate.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  include /etc/nginx/snippets/factory-desk-common.conf;
}
