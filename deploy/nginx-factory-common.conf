# Factory Desk — shared server settings (security headers, proxying, limits).
# Install:  sudo cp deploy/nginx-factory-common.conf /etc/nginx/snippets/factory-desk-common.conf
# Included by every site file: deploy/docker/nginx-site-*.conf (Docker) and deploy/nginx-factory*.conf (plain server).

server_tokens off;
charset utf-8;

# Ordinary API requests are small; only the backup upload location below allows 100 MB.
client_max_body_size 2m;
client_body_timeout 30s;
keepalive_timeout 30s;
limit_conn factory_conn 30;

# --- security headers (sent on every response, including errors) ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The app loads nothing from other sites. Element Plus needs inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# --- compression ---
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

# --- proxy to Node: the upstream "factory_app" is defined in the site file
#     (127.0.0.1:8787 on a plain server, app:8787 in docker-compose) ---
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;                 # Node trusts this only from loopback / FACTORY_TRUSTED_PROXIES
proxy_set_header X-Forwarded-For $remote_addr;           # overwrite, never pass client-supplied values on
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_hide_header X-Content-Type-Options;   # Nginx adds it for every response above
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

location = /api/auth/login {
  limit_req zone=factory_login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://factory_app;
}

# Backup upload (admin only, checked by the app): large body, streamed straight to Node.
location = /api/admin/backups/upload {
  client_max_body_size 100m;
  client_body_timeout 300s;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  limit_req zone=factory_api burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://factory_app;
}

# Backup download / restore can take a while on a large database.
location ~ ^/api/admin/backups/ {
  proxy_read_timeout 300s;
  limit_req zone=factory_api burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://factory_app;
}

location /api/ {
  limit_req zone=factory_api burst=60 nodelay;
  limit_req_status 429;
  proxy_pass http://factory_app;
}

# Hidden files (.env, .git …) are never served.
location ~ /\. {
  deny all;
  return 404;
}

# Front-end pages and hashed assets (Node sets long-term caching for /assets/*).
location / {
  proxy_pass http://factory_app;
}
