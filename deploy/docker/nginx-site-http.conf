# Factory Desk (Docker) — HTTP site, for access by IP before a certificate is available.
# Active copy on the server: /opt/factory-desk/nginx-site.conf (mounted into the nginx container).
#   cp deploy/docker/nginx-site-http.conf /opt/factory-desk/nginx-site.conf
# Plain HTTP sends passwords and login tokens unencrypted — switch to nginx-site-https.conf as soon as
# you have a certificate (see DEPLOY_SERVER.md).

upstream factory_app {
  server app:8787;          # the app container on the internal "backend" network
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;

  access_log /var/log/nginx/factory-desk.access.log;
  error_log  /var/log/nginx/factory-desk.error.log warn;

  # Lets certbot (webroot mode) prove control of the domain when requesting the first certificate.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  include /etc/nginx/snippets/factory-desk-common.conf;
}
