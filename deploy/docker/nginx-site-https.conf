# Factory Desk (Docker) — HTTPS site. Replace factory.example.com with your domain:
#   cp deploy/docker/nginx-site-https.conf /opt/factory-desk/nginx-site.conf
#   sed -i 's/factory.example.com/你的域名/g' /opt/factory-desk/nginx-site.conf
#   docker compose up -d --force-recreate nginx
# Certificates are read from /opt/factory-desk/letsencrypt/conf (mounted as /etc/letsencrypt).

upstream factory_app {
  server app:8787;
  keepalive 16;
}

# Plain HTTP: keep the ACME path for renewals, send everything else to HTTPS.
server {
  listen 80 default_server;
  server_name factory.example.com;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name factory.example.com;

  ssl_certificate     /etc/letsencrypt/live/factory.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/factory.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:FactorySSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Enable once HTTPS has worked reliably for a while: browsers will then refuse plain HTTP for a year.
  # add_header Strict-Transport-Security "max-age=31536000" always;

  access_log /var/log/nginx/factory-desk.access.log;
  error_log  /var/log/nginx/factory-desk.error.log warn;

  include /etc/nginx/snippets/factory-desk-common.conf;
}
